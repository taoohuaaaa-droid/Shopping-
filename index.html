
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40 Level Reward Game Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .level-box {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .level {
            background: #e0e7ff;
            color: #3730a3;
            padding: 12px 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level:hover {
            background: #c7d2fe;
            transform: scale(1.05);
        }

        .level.completed {
            background: #10b981;
            color: white;
        }

        .reward-box {
            background: #fffbeb;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #fcd34d;
        }

        .reward-box h3 {
            color: #b45309;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Reward Game Platform</h1>
        <p class="subtitle">40 Level Reward System</p>

        <div class="level-box" id="levelBox">
            <!-- Levels will be auto-generated here -->
        </div>

        <div class="reward-box">
            <h3>🏆 Your Reward</h3>
            <p>Complete levels to unlock amazing rewards!</p>
        </div>
    </div>

    <script>
        // Generate 40 Levels
        const levelBox = document.getElementById('levelBox');
        for (let i = 1; i <= 40; i++) {
            const level = document.createElement('div');
            level.classList.add('level');
            level.textContent = i;
            level.onclick = function() {
                this.classList.toggle('completed');
            };
            levelBox.appendChild(level);
        }
    </script>

</body>
</html>
